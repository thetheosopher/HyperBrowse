name: HyperBrowse CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hyperbrowse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-benchmark:
    name: Build, test, and benchmark (${{ matrix.decode-path.name }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        decode-path:
          - name: nvjpeg
            nvjpeg: ON
          - name: wic-fallback
            nvjpeg: OFF
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64
          -DHYPERBROWSE_BUILD_TESTS=ON
          -DHYPERBROWSE_ENABLE_LIBRAW=ON
          -DHYPERBROWSE_ENABLE_NVJPEG=${{ matrix.decode-path.nvjpeg }}
          -DHYPERBROWSE_BUNDLE_CUDA_REDIST=OFF
          -DHYPERBROWSE_WARNINGS_AS_ERRORS=ON

      - name: Build Debug
        run: cmake --build build-ci --config Debug --target HyperBrowse HyperBrowseTests HyperBrowsePerformanceBenchmark -- /m /v:minimal

      - name: Run Debug tests
        run: ctest --test-dir build-ci -C Debug --output-on-failure

      - name: Build Release
        run: cmake --build build-ci --config Release --target HyperBrowse HyperBrowseTests HyperBrowsePerformanceBenchmark -- /m /v:minimal

      - name: Run Release tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Run repeated Release benchmark suite
        shell: pwsh
        run: >-
          ./tools/RunBenchmarks.ps1
          -ProjectRoot $env:GITHUB_WORKSPACE
          -BuildDir (Join-Path $env:GITHUB_WORKSPACE 'build-ci')
          -Configuration Release
          -Scenario All
          -DatasetId A
          -Runs 5
          -RunnerImage windows-2022
          -DecodePath ${{ matrix.decode-path.name }}
          -ProfileId windows-2022/${{ matrix.decode-path.name }}
          -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'build-ci/bench')
          -MarkdownPath (Join-Path $env:GITHUB_WORKSPACE 'docs/perf/latest.md')
          -BaselinePath (Join-Path $env:GITHUB_WORKSPACE 'docs/perf/baseline.json')
          -CompareBaseline
          -AllowProvisionalBaseline
          -ProcessToFirstWindowVisibleBudgetMs 2500
          -FirstWindowVisibleToFirstThumbnailPaintedBudgetMs 2500
          -ProcessToFirstThumbnailPaintedBudgetMs 5000
          -CacheHitAverageBudgetMs 10
          -MinimumStoreEntriesPerSecond 100
          -CompactionBudgetMs 5000
          -CacheWorkerQueueDelayMaxBudgetMs 500
          -MinimumScrollMessagesPerSecond 250

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.decode-path.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            build-ci/bench/**
            build/benchmark-datasets/A/**
            docs/perf/latest.md
            ${{ runner.temp }}/HyperBrowse-debug.log
          retention-days: 90

  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Configure release package
        shell: pwsh
        run: >-
          cmake -S . -B build-ci-package -G "Visual Studio 17 2022" -A x64
          -DHYPERBROWSE_BUILD_TESTS=ON
          -DHYPERBROWSE_ENABLE_LIBRAW=ON
          -DHYPERBROWSE_ENABLE_NVJPEG=ON
          -DHYPERBROWSE_BUNDLE_CUDA_REDIST=ON
          -DHYPERBROWSE_WARNINGS_AS_ERRORS=ON
          -DHYPERBROWSE_INNO_SETUP_COMPILER="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"

      - name: Build performance benchmark for package CTest
        run: cmake --build build-ci-package --config Release --target HyperBrowsePerformanceBenchmark -- /m /v:minimal

      - name: Build and validate release artifacts
        run: cmake --build build-ci-package --config Release --target HyperBrowseReleaseArtifacts -- /m /v:minimal

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: ignore
          path: build-ci-package/dist/*

  sanitizer-fuzz:
    name: AddressSanitizer boundary fuzz tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure dynamic-runtime ASAN build
        shell: pwsh
        run: >-
          cmake -S . -B build-ci-asan -G "Visual Studio 17 2022" -A x64
          -DHYPERBROWSE_BUILD_TESTS=ON
          -DHYPERBROWSE_BUILD_FUZZ_TESTS=ON
          -DHYPERBROWSE_ENABLE_LIBRAW=OFF
          -DHYPERBROWSE_ENABLE_NVJPEG=OFF
          -DHYPERBROWSE_BUNDLE_CUDA_REDIST=OFF
          -DHYPERBROWSE_STATIC_MSVC_RUNTIME=OFF
          -DHYPERBROWSE_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="/fsanitize=address"
          -DCMAKE_EXE_LINKER_FLAGS_DEBUG="/DEBUG /INCREMENTAL:NO"

      - name: Build boundary fuzz target
        run: cmake --build build-ci-asan --config Debug --target HyperBrowseBoundaryFuzz -- /m /v:minimal

      - name: Run cache and RAW-helper boundary fuzz tests
        shell: pwsh
        run: >-
          $cachePath = Join-Path $env:GITHUB_WORKSPACE 'build-ci-asan/CMakeCache.txt';
          $generatorInstanceLine = Select-String -Path $cachePath -Pattern '^CMAKE_GENERATOR_INSTANCE:INTERNAL=(.+)$' | Select-Object -First 1;
          if ($null -eq $generatorInstanceLine) { throw 'The selected Visual Studio instance was not recorded in CMakeCache.txt.' };
          $generatorInstance = $generatorInstanceLine.Matches[0].Groups[1].Value;
          $toolsetVersionLine = Select-String -Path $cachePath -Pattern '^CMAKE_VS_PLATFORM_TOOLSET_VERSION:[^=]*=(.+)$' | Select-Object -First 1;
          if ($null -ne $toolsetVersionLine) {
            $toolsetVersion = $toolsetVersionLine.Matches[0].Groups[1].Value;
          } else {
            $defaultToolsetPath = Join-Path $generatorInstance 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt';
            if (-not (Test-Path -LiteralPath $defaultToolsetPath -PathType Leaf)) { throw 'The selected Visual Studio instance has no default MSVC toolset metadata.' };
            $toolsetVersion = (Get-Content -LiteralPath $defaultToolsetPath -Raw).Trim();
          };
          $toolsetRoot = Join-Path $generatorInstance "VC/Tools/MSVC/$toolsetVersion";
          if (-not (Test-Path -LiteralPath $toolsetRoot -PathType Container)) { throw "Selected MSVC toolset $toolsetVersion was not found." };
          $asanRuntimeDirectory = Join-Path $toolsetRoot 'bin/Hostx64/x64';
          $asanRuntime = Join-Path $asanRuntimeDirectory 'clang_rt.asan_dynamic-x86_64.dll';
          if (-not (Test-Path -LiteralPath $asanRuntime -PathType Leaf)) { throw "MSVC AddressSanitizer runtime was not found for toolset $toolsetVersion." };
          $env:PATH = "$asanRuntimeDirectory;$env:PATH";
          $env:ASAN_OPTIONS = 'abort_on_error=1:halt_on_error=1:detect_leaks=0';
          ctest --test-dir build-ci-asan -C Debug -R 'HyperBrowse(PersistentCache|RawHelperProtocol)Fuzz' --output-on-failure 2>&1 |
          Tee-Object -FilePath build-ci-asan/asan-fuzz.log;
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitizer and fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-fuzz-artifacts
          if-no-files-found: ignore
          path: |
            build-ci-asan/asan-fuzz.log
            build-ci-asan/Testing/Temporary/LastTest.log
            build-ci-asan/**/*.dmp
